[package]
name = "ugjy-g2p"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Multilingual G2P for ugjy TTS engine"

[lib]
name = "ugjy_g2p"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["english", "japanese", "naist-jdic", "bundled-dicts"]
japanese = ["dep:jpreprocess", "dep:bincode"]
naist-jdic = ["japanese", "jpreprocess/naist-jdic"]
english = []
chinese = []
korean = []
spanish = []
french = []
portuguese = []
swedish = []
ffi = []
bundled-dicts = []
all-languages = ["japanese", "english", "chinese", "korean", "spanish", "french", "portuguese", "swedish"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
quick-xml = "0.41"
tracing = "0.1"
jpreprocess = { version = "0.9", optional = true }
bincode = { version = "1", optional = true }
